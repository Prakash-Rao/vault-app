<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting…</title>
</head>
<body>
<script>
  // Safety-net pass-through in case an old cached install still points here —
  // forward straight to index.html with the same query string, no localStorage.
  window.location.replace('./index.html' + window.location.search);
</script>
</body>
</html>
